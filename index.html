  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: "Poppins", "Noto Sans JP", sans-serif;
      background: #f8f5f1;
      overflow-x: hidden;
      color: #222;
    }

    img {
      width: 100%;

    }

    a {

    }

    section {
      padding: 100px 10%;

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 10%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
      background: rgba(0, 0, 0, 0.15);
      z-index: 1000;

    nav h1 {

      font-size: 28px;
      font-weight: 700;
    }

    nav a:hover {
      color: #ffd369;
    }

    .hero {
      height: 100vh;
      background:

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .hero-content h2 {
      font-size: 80px;
      margin-bottom: 20px;
      letter-spacing: 3px;
    }

    .hero-content p {
      font-size: 22px;
      margin-bottom: 35px;
      line-height: 1.8;
    }

    .hero-content a {
      padding: 15px 40px;
      background: #ffd369;
      color: black;
      border-radius: 50px;
      font-weight: 600;
      transition: 0.4s;

    .hero-content a:hover {
      background: white;
      transform: translateY(-5px);
    }

    .title {
      text-align: center;
      margin-bottom: 60px;
    }

    .title h2 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .title p {
      color: #777;
      font-size: 18px;
    }

    .about {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 60px;
      align-items: center;
    }

    .about img {
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .about-text h3 {
      font-size: 38px;
      margin-bottom: 25px;
    }

    .about-text p {
      color: #555;
      line-height: 2;
      font-size: 17px;
    }

    .place {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 50px;
      align-items: center;
      margin-bottom: 100px;
    }

    .place img {
      border-radius: 25px;
      height: 400px;
      object-fit: cover;
      transition: 0.5s;
    }

    .place img:hover {
      transform: scale(1.03);
    }

    .place-content h3 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    .place-content p {
      color: #666;
      line-height: 2;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 35px;
      border-radius: 50px;
      background: black;
      color: white;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ffd369;
      color: black;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 60px 10%;
    }

    footer h2 {
      font-size: 35px;
      margin-bottom: 20px;
