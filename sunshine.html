<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>サンシャイン60 | 東京旅行</title>

    <style>
        /* =========================
   RESET
========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            background:
                linear-gradient(to bottom,
                    #f8fafc,
                    #ffffff,
                    #fff7f7);

            color: #333;

            line-height: 1.8;
        }

        /* =========================
   HERO
========================= */

        .hero {
            position: relative;

            height: 85vh;

            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            filter: brightness(65%);
        }

        .hero::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(to right,
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.15));
        }

        .hero-text {
            position: absolute;

            top: 50%;
            left: 8%;

            transform: translateY(-50%);

            z-index: 5;

            color: white;
        }

        .hero-text h1 {

            font-size: 90px;

            letter-spacing: 8px;

            margin-bottom: 20px;

            font-weight: 900;
        }

        .hero-text p {

            font-size: 24px;

            color: #f1f1f1;
        }

        /* =========================
   CONTAINER
========================= */

        .container {
            width: 90%;
            max-width: 1300px;

            margin: auto;

            padding: 100px 0;
        }

        /* =========================
   DESCRIPTION
========================= */

        .description {

            background: white;

            padding: 70px;

            border-radius: 35px;

            margin-bottom: 90px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .description h2 {

            font-size: 48px;

            margin-bottom: 30px;

            color: #111;
        }

        .description p {

            font-size: 18px;

            color: #666;

            margin-bottom: 15px;
        }

        /* =========================
   QUOTE
========================= */

        .quote {

            text-align: center;

            margin-bottom: 100px;
        }

        .quote h2 {

            font-size: 38px;

            color: #ff7aa2;

            font-style: italic;

            line-height: 1.6;
        }

        /* =========================
   GALLERY
========================= */

        .gallery {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 35px;

            margin-bottom: 100px;
        }

        /* =========================
   CARD
========================= */

        .gallery-card {

            background: white;

            border-radius: 28px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            transition: 0.4s;
        }

        .gallery-card:hover {

            transform:
                translateY(-10px);
        }

        /* =========================
   IMAGE
========================= */

        .gallery-item {

            position: relative;

            overflow: hidden;

            height: 280px;
        }

        .gallery-item img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: 0.5s;
        }

        .gallery-item:hover img {

            transform: scale(1.08);
        }

        /* =========================
   OVERLAY
========================= */

        .overlay {

            position: absolute;
            inset: 0;

            background:
                linear-gradient(to top,
                    rgba(0, 0, 0, 0.85),
                    rgba(0, 0, 0, 0.1));

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            padding: 25px;

            opacity: 0;

            transition: 0.4s;
        }

        .gallery-item:hover .overlay {

            opacity: 1;
        }

        .overlay h3 {

            color: white;

            font-size: 30px;

            margin-bottom: 10px;
        }

        .overlay p {

            color: #eee;
        }

        /* =========================
   CAPTION
========================= */

        .gallery-caption {

            padding: 25px;

            color: #666;

            font-size: 15px;

            line-height: 1.9;
        }

        /* =========================
   INFO + MAP
========================= */

        .info-map {

            display: grid;

            grid-template-columns:
                1fr 1.3fr;

            gap: 40px;

            align-items: stretch;

            margin-bottom: 100px;
        }

        .info-box {

            background: white;

            padding: 50px;

            border-radius: 35px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            display: flex;

            flex-direction: column;

            justify-content: center;
        }

        .info-box h3 {

            font-size: 42px;

            margin-bottom: 30px;
        }

        .info-box p {

            font-size: 18px;

            color: #555;

            margin-bottom: 25px;

            line-height: 1.9;
        }

        .map-box iframe {

            width: 100%;

            height: 100%;

            min-height: 450px;

            border: none;

            border-radius: 35px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        @media(max-width:900px) {

            .info-map {

                grid-template-columns: 1fr;
            }

        }

        /* =========================
   BUTTONS
========================= */

        .page-navigation {

            display: flex;

            justify-content: center;

            gap: 30px;

            flex-wrap: wrap;
        }

        .nav-btn {

            padding: 16px 38px;

            border-radius: 50px;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;

            color: white;

            background:
                linear-gradient(135deg,
                    #ff7aa2,
                    #ff9fb7);

            box-shadow:
                0 10px 25px rgba(255, 120, 160, 0.25);

            transition: 0.4s;
        }

        .nav-btn:hover {

            transform:
                translateY(-5px) scale(1.05);

            box-shadow:
                0 15px 35px rgba(255, 120, 160, 0.35);
        }

        /* =========================
   FOOTER
========================= */

        footer {

            margin-top: 120px;

            background: white;

            padding: 40px;

            text-align: center;

            color: #777;

            border-top:
                1px solid rgba(0, 0, 0, 0.05);
        }

        @media(max-width:900px) {

            .hero-text h1 {

                font-size: 60px;
            }

            .hero-text p {

                font-size: 18px;
            }

            .description {

                padding: 40px;
            }

            .description h2 {

                font-size: 36px;
            }

            .quote h2 {

                font-size: 28px;
            }

        }
    </style>

</head>

<body>

    <section class="hero">
        <img src="image/42.jpg">
        <div class="hero-text">
            <h1>サンシャイン60</h1>
        </div>
    </section>

    <div class="container">

        <div class="description">
            <h2>🌇 サンシャイン60</h2>
            <p>サンシャイン60（サンシャインろくじゅう、英称:Sunshine 60）は東京都豊島区東池袋にある超高層ビルです。</p>
            <p>🌃 高層階から東京の景色を一望でき、夜景がとても美しいことで知られています。</p>
            <p>📸 観光スポットとして人気があります。</p>
            <p>✨ 東京の現代的な雰囲気を感じられます。</p>
        </div>

        <section class="quote">
            <h2>「東京は眠らない街だからこそ美しい。」</h2>
        </section>

        <div class="gallery">

            <!-- giữ nguyên gallery của bạn (đã dịch ở trên) -->

        </div>

        <section class="info-map">

            <div class="info-box">
                <h3>📍 情報</h3>
                <p>🚌 池袋御嶽神社からサンシャイン60までは約10〜15分です。</p>
                <p>🚶 合計約20〜30分です。</p>
                <p>💴 約220円</p>
            </div>

            <div class="map-box">
                <iframe src="https://www.google.com/maps?q=Sunshine+City+Tokyo&output=embed"></iframe>
            </div>

        </section>

        <div class="page-navigation">
            <a href="ikebukuro.html" class="nav-btn">⬅ 戻る</a>
            <a href="anime.html" class="nav-btn">次へ ➜</a>
        </div>

    </div>

    <footer>
        <p>© 東京旅行ガイド</p>
    </footer>

</body>

</html>
