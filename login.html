<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="index.html">

  <title>Login | 東京案内書</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Poppins",sans-serif;
    }

    body{

      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:
      linear-gradient(rgba(0,0,0,0.45),
      rgba(0,0,0,0.6)),
      url("image/60.jpg") center/cover;

      overflow:hidden;
    }

    .login-container{

      width:420px;

      padding:50px 40px;

      border-radius:35px;

      background:rgba(255,255,255,0.12);

      backdrop-filter:blur(18px);

      border:1px solid rgba(255,255,255,0.2);

      box-shadow:
      0 25px 50px rgba(0,0,0,0.35);

      text-align:center;

      color:white;
    }

    .login-container h1{

      font-size:45px;

      margin-bottom:10px;

      letter-spacing:3px;
    }

    .login-container p{

      color:#eee;

      margin-bottom:35px;

      font-size:14px;
    }

    .input-box{

      margin-bottom:20px;
    }

    .input-box input{

      width:100%;

      padding:15px 18px;

      border:none;

      outline:none;

      border-radius:50px;

      background:rgba(255,255,255,0.92);

      font-size:15px;
    }

    .login-btn{

      width:100%;

      padding:15px;

      border:none;

      border-radius:50px;

      cursor:pointer;

      background:
      linear-gradient(135deg,
      #c4452d,
      #e8845c);

      color:white;

      font-size:15px;

      margin-top:10px;

      transition:0.4s;
    }

    .login-btn:hover{

      transform:translateY(-3px);
    }

    .divider{

      margin:30px 0;

      position:relative;

      color:#ddd;

      font-size:13px;
    }

    .divider::before,
    .divider::after{

      content:"";

      position:absolute;

      top:50%;

      width:35%;

      height:1px;

      background:rgba(255,255,255,0.3);
    }

    .divider::before{
      left:0;
    }

    .divider::after{
      right:0;
    }

    .social-login{

      display:flex;

      flex-direction:column;

      gap:15px;
    }

    .social-btn{

      display:flex;
      align-items:center;
      justify-content:center;

      gap:10px;

      padding:14px;

      border-radius:50px;

      background:rgba(255,255,255,0.15);

      border:1px solid rgba(255,255,255,0.2);

      color:white;

      transition:0.4s;

      cursor:pointer;
    }

    .social-btn:hover{

      background:rgba(255,255,255,0.25);

      transform:translateY(-2px);
    }

    .back-home{

      display:inline-block;

      margin-top:30px;

      color:#fff;

      font-size:14px;

      opacity:0.8;
    }

    .back-home:hover{

      opacity:1;
    }

    @media(max-width:500px){

      .login-container{

        width:90%;
        padding:40px 25px;
      }

      .login-container h1{

        font-size:35px;
      }

    }

  </style>

</head>

<body>

  <div class="login-container">

    <h1>LOGIN</h1>

    <p>
      東京案内書へようこそ
    </p>

    <div class="input-box">
      <input type="email"
             placeholder="Email">
    </div>

    <div class="input-box">
      <input type="password"
             placeholder="Password">
    </div>

    <button class="login-btn">
      Sign In
    </button>

    <div class="divider">
      OR CONTINUE WITH
    </div>

    <div class="social-login">

      <div class="social-btn">
        🔵 Sign in with Google
      </div>

      <div class="social-btn">
        🔷 Sign in with Facebook
      </div>

      <div class="social-btn">
        ⚫ Sign in with GitHub
      </div>

    </div>

    <a href="index.html"
       class="back-home">
      ← Back To Home
    </a>

  </div>

</body>

</html>
